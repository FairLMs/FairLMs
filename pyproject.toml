[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairllms"
# Single-sourced from fairllms/_version.py — see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Fairness definitions and bias metrics for large language models"
readme = "README.md"
# 3.10 is the real floor: torch, transformers and datasets all require >=3.10.
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "torch>=2.0",
    "transformers>=4.38",
    "datasets>=2.19",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
all = [
    "fairllms[openai,dev]",
    "accelerate>=0.30",
    "sentencepiece",
    "scikit-learn",
    "gender-guesser",
    "tqdm",
]

[tool.setuptools.dynamic]
version = { attr = "fairllms._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Surface accidental use of the deprecated keyword API inside the library
    # itself; tests that exercise it opt in with pytest.warns.
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairllms*"]

[tool.setuptools.package-data]
fairllms = [
    "data/crows_pairs/*.csv",
    "data/bbq/*.jsonl",
]
