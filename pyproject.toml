[build-system]
# setuptools>=77 for PEP 639 SPDX license metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fairlms"
# Single-sourced from fairlms/_version.py — see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Fairness definitions and bias metrics for large language models"
readme = "README.md"
# 3.10 is the real floor: torch, transformers and datasets all require >=3.10.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Larionov", email = "mlariono@andrew.cmu.edu" },
    { name = "Jiale Zhang", email = "jz106@iu.edu" },
    { name = "Zhipeng Yin", email = "zyin007@fiu.edu" },
    { name = "Zichong Wang", email = "zwang114@fiu.edu" },
    { name = "Wenbin Zhang", email = "wenbin.zhang@fiu.edu" },
]
keywords = [
    "fairness",
    "bias",
    "large-language-models",
    "nlp",
    "evaluation",
    "metrics",
    "responsible-ai",
]
# No "License ::" classifier: PEP 639 supersedes it with the SPDX `license` field
# above, and setuptools rejects declaring both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "torch>=2.0",
    "transformers>=4.38",
    "datasets>=2.19",
    # These three are imported at module scope inside fairlms/definition/, and
    # fairlms.metrics eagerly imports every family, so `import fairlms` fails
    # without them. They are requirements, not extras:
    #   scikit-learn -> counterfactual_auc, normalized_position_distance
    #   wordfreq     -> lexical_frequency_proportion
    #   nltk         -> morphological_choice_divergence (bundled SnowballStemmer,
    #                   no corpus download needed)
    # Making those imports lazy would let these move back to extras.
    "scikit-learn>=1.3",
    "wordfreq>=3.0",
    "nltk>=3.8",
]

# Keep table sections below all bare `[project]` keys — a bare key placed after a
# `[table]` header is parsed as belonging to that table, not to [project].
[project.urls]
Homepage = "https://github.com/michaellarionov/FairLMs"
Repository = "https://github.com/michaellarionov/FairLMs"
Issues = "https://github.com/michaellarionov/FairLMs/issues"

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
grammar = [
    "language-tool-python>=2.7",
]
parse = [
    "spacy>=3.5",
]
nlp = [
    "fairlms[grammar,parse]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "tomli>=2.0; python_version < '3.11'",
    "fairlms[openai]",
]
all = [
    "fairlms[openai,dev,nlp]",
    "accelerate>=0.30",
    "sentencepiece",
    "gender-guesser",
    "tqdm",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
  "mkdocs-jupyter>=0.24",
  # mkdocstrings needs a formatter to render `separate_signature: true`
  # signatures; without one it logs "Formatting signatures requires either
  # Black or Ruff to be installed" and emits them unformatted.
  "black>=24.1",
]

[tool.setuptools.dynamic]
version = { attr = "fairlms._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `fairlms/definition/` holds 33 `main.py` and 25 `stimuli.py` files in sibling
# directories. Under the default "prepend" import mode pytest names a module by
# its basename, so collecting the package -- `pytest --doctest-modules fairlms/`
# -- aborts with 56 "import file mismatch" errors and every doctest in the
# library goes unrun. importlib mode derives the module name from the full path
# instead, so the duplicate basenames stop colliding.
addopts = ["--import-mode=importlib"]
filterwarnings = [
    # Surface accidental use of the deprecated keyword API inside the library
    # itself; tests that exercise it opt in with pytest.warns.
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.black]
target-version = ["py310"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairlms*"]

[tool.setuptools.package-data]
# fairlms/data/ has an __init__.py (it exports the bundled WEAT/SEAT word sets),
# so it is a package in its own right and owns these files. Keyed on
# `fairlms.data` for that reason. The older `fairlms = ["data/bbq/*.jsonl"]`
# form still resolves on setuptools>=77, so this is correctness, not a fix.
"fairlms.data" = [
    "README.md",
    "NOTICE.md",
    "checksums.json",
    "crows_pairs/*.csv",
    "bbq/*.jsonl",
]
