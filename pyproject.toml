[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairLLMs"
version = "0.1.0"
description = "Fairness definitions and bias metrics for large language models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "torch>=2.0",
    "transformers>=4.38",
    "datasets>=2.19",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
all = [
    "fairLLMs[openai,dev]",
    "accelerate>=0.30",
    "sentencepiece",
    "scikit-learn",
    "gender-guesser",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fairLLMs*"]

[tool.setuptools.package-data]
fairLLMs = [
    "data/crows_pairs/*.csv",
    "data/bbq/*.jsonl",
]
