name: publish

# Publishes to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere. Before
# the first run you must register this workflow as a trusted publisher:
#
#   https://pypi.org/manage/account/publishing/
#     PyPI project name : fairllms
#     Owner             : michaellarionov
#     Repository name   : JMLR_Library
#     Workflow name     : publish.yml
#     Environment name  : pypi
#
# Then create a GitHub environment named `pypi` (Settings -> Environments) and,
# if you want a manual gate before anything reaches PyPI, add yourself as a
# required reviewer there.
#
# PyPI uploads are permanent: a version number can never be reused, even after
# deletion. The test-pypi job below lets you rehearse first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # Validates rendered README and metadata the way PyPI will.
      - name: Check distributions
        run: python -m twine check --strict dist/*

      # Guards against the tag disagreeing with fairllms/_version.py, which
      # would publish a version nobody can reproduce from the tag.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"\"(.+?)\"", pathlib.Path("fairllms/_version.py").read_text()).group(1))')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag != _version.py $pkg"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
